spring:
  application:
    name: food-delivery-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/food_delivery}
    username: ${DATABASE_USERNAME:food_app}
    password: ${DATABASE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
server:
  port: ${PORT:8080}
app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
